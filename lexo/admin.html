<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src https://*.workers.dev https://teoteloexplica.com; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Lexo · Administración</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app admin">
  <header class="top"><img src="icons/icon-192.png" alt=""><div class="quien"><b>Lexo<small>admin</small></b><span>Solo para ti</span></div></header>
  <main class="chat">
    <form class="hoja admin-hoja" id="f">
      <h2>Tus cuentas</h2>
      <p>Pega tu clave de administrador (ADMIN_KEY). No se guarda en ningún sitio: se borra al cerrar la página.</p>
      <input class="campo" id="clave" type="password" autocomplete="off" placeholder="Clave de administrador" aria-label="Clave de administrador">
      <button class="boton negro" type="submit">Ver resumen</button>
      <div class="texto-largo" id="salida" hidden></div>
      <button class="boton" id="csv" type="button" hidden>Descargar cuentas.csv para el panel</button>
    </form>
  </main>
</div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
